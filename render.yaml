services:
  - type: web
    name: cata-ofertas
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cata-ofertas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USUARIO
        value: victor
      - key: ADMIN_SENHA
        sync: false

databases:
  - name: cata-ofertas-db
    plan: free
